name: Laptop probe or problem
description: Report how eMailSuperSearch installs and runs on your laptop, or something that went wrong there.
title: "Laptop probe: "
labels: ["laptop-probe"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form to send the results of a laptop run, or a problem, back for fixing.

        **This repository is public: anyone can read what you post here.** Do not name your company, its proxy
        servers, internal tools or security software, and do not post anything you would not publish under your name.

        **Never paste email contents, attachments, subjects or addresses.** The `doctor` report and the `bench` output below contain only facts about the machine and timings. Log lines at the default level hide subjects, paths and addresses behind short hashes; do not paste anything logged at the DEBUG level, which writes them in full.

        Run the commands in a Command Prompt on the laptop.

  - type: dropdown
    id: kind
    attributes:
      label: What is this report?
      options:
        - First install and probe results
        - Something went wrong
        - Both
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `%LOCALAPPDATA%\eMailSuperSearch\venv\Scripts\python -m emailsupersearch --version`
      placeholder: "0.1.2"
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: doctor output
      description: Paste the full output of `%LOCALAPPDATA%\eMailSuperSearch\venv\Scripts\python -m emailsupersearch doctor`. It is redacted and safe to share.
      render: text
    validations:
      required: true

  - type: textarea
    id: bench
    attributes:
      label: bench output
      description: Paste the output of `%LOCALAPPDATA%\eMailSuperSearch\venv\Scripts\python -m emailsupersearch bench --json --vectors 50000`. It takes a few minutes. Leave empty if you only report a problem.
      render: json

  - type: textarea
    id: problem
    attributes:
      label: What went wrong
      description: What you did, what you expected, and what happened instead. Include the exact error text. Leave empty for a clean probe.
      placeholder: |
        1. I ran ...
        2. I expected ...
        3. Instead ...

  - type: textarea
    id: log
    attributes:
      label: Log excerpt
      description: Optional. The last lines of `%LOCALAPPDATA%\eMailSuperSearch\logs\host.log` around the problem, at the default log level only.
      render: text

  - type: textarea
    id: archive
    attributes:
      label: Archive and laptop
      description: Optional. Roughly how many emails and folders you indexed, how long the first index took, and anything unusual about the laptop (for example new Outlook, a company proxy, blocked programs), described generically without names.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have not pasted any email contents, attachments, subjects or addresses, no DEBUG-level log lines,
            and nothing that names my company or its internal systems.
          required: true
